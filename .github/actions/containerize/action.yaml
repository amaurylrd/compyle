name: Run containerize and cosign
description: Build Docker image and sign with Cosign

inputs:
  cosign-key:
    description: "The Cosign private key for signing the Docker image"
    default: ${{ secrets.COSIGN_PRIVATE_KEY }}
  cosign-password:
    description: "The password for the Cosign private key"
    default: ${{ secrets.COSIGN_PASSWORD }}
  registry-username:
    description: "Registry username (e.g., GitHub username)"
    default: ${{ github.actor }}
  registry-password:
    description: "Registry password or PAT (e.g., GHCR token)"
    default: ${{ github.token }}
  image:
    description: "The Docker image to build and push"
    default: ghcr.io/${{ github.repository }}:latest

runs:
  using: composite
  steps:
  - uses: docker/login-action@v2
    with:
      registry: ghcr.io
      username: ${{ inputs.registry-username }}
      password: ${{ inputs.registry-password }}
  - uses: docker/build-push-action@v4
    with:
      context: .
      push: true
      tags: ${{ inputs.image }}
  - run: cosign sign --key ${{ inputs.cosign-key }} ${{ inputs.image }}
    shell: bash
    env:
      COSIGN_PASSWORD: ${{ inputs.cosign-password }}

